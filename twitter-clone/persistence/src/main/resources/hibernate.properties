# Database connection settings
hibernate.connection.url=jdbc:sqlite:../twitter-clone.db
hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
hibernate.connection.driver_class=org.sqlite.JDBC
hibernate.connection.username=
hibernate.connection.password=

# Echo all executed SQL to console
hibernate.show_sql=true
hibernate.format_sql=true
hibernate.highlight_sql=true

# Automatically export the schema
# Use "create" if you'd like a clean database at each start
# For more details, see https://docs.jboss.org/hibernate/orm/7.1/userguide/html_single/Hibernate_User_Guide.html#settings-hibernate.hbm2ddl.auto
hibernate.hbm2ddl.auto=update
